owner: substrate-systems
repo: exomem-status
secrets: []
skipGeneratingWebsite: true

sites:
  - name: Website and sign-in
    url: https://substratesystems.io/exomem
    icon: https://status.substratesystems.io/favicon.svg
    expectedStatusCodes: [200]
    maxResponseTime: 5000

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"

status-website:
  cname: status.substratesystems.io
  logoUrl: https://status.substratesystems.io/exomem-wordmark-initial.svg
  logoHref: https://substratesystems.io/exomem
  name: Exomem status
  favicon: https://status.substratesystems.io/favicon-32.png
  faviconSvg: https://status.substratesystems.io/favicon.svg
  themeUrl: https://status.substratesystems.io/exomem-status.css
  introTitle: Exomem status
  introMessage: "Checks run every five minutes from outside our servers. GitHub Actions may delay a scheduled check. Missing measurements mean health is unknown."
  navbar:
    - title: Status
      href: /
    - title: Paddle status (payments)
      href: https://paddlestatus.com/
    - title: Exomem
      href: https://substratesystems.io/exomem

i18n:
  allSystemsOperational: "No open incidents are recorded."
  errorTitle: Status details unavailable
  errorIntro: "The latest status details could not be loaded. Service health is unknown."
  errorText: "Try again in a few moments, or open the status repository for recorded checks and incidents."
  footer: "[Recorded checks and incidents]($REPO) · Powered by [Upptime](https://upptime.js.org)"
